
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body-wrap {
    font-family: 'Sora', sans-serif;
  }

  .bank-app {
    font-family: 'Sora', sans-serif;
    background: var(--color-background-primary);
    min-height: 600px;
    color: var(--color-text-primary);
    padding: 0;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ---- LOGIN ---- */
  .login-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 2rem;
  }

  .bank-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 2.5rem;
  }

  .logo-icon {
    width: 56px; height: 56px;
    background: #1a1a2e;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }

  .logo-name {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--color-text-primary);
  }

  .logo-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: -6px;
  }

  .login-card {
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1.75rem;
    width: 100%;
    max-width: 360px;
  }

  .login-title {
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 1.5rem;
    color: var(--color-text-primary);
  }

  .field { margin-bottom: 1rem; }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  .field input {
    width: 100%;
    padding: 0 12px;
    height: 40px;
    border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    font-size: 14px;
    font-family: 'Sora', sans-serif;
    outline: none;
    transition: border-color 0.15s;
  }

  .field input:focus { border-color: #4f46e5; }

  .btn-primary {
    width: 100%;
    height: 42px;
    background: #1a1a2e;
    color: #fff;
    border: none;
    border-radius: var(--border-radius-md);
    font-size: 14px;
    font-weight: 500;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: opacity 0.15s;
  }

  .btn-primary:hover { opacity: 0.85; }

  .login-hint {
    font-size: 12px;
    color: var(--color-text-secondary);
    text-align: center;
    margin-top: 1rem;
  }

  /* ---- TOP BAR ---- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.25rem;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
  }

  .topbar-logo {
    font-size: 15px; font-weight: 600; letter-spacing: -0.3px;
  }

  .topbar-user {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--color-text-secondary);
  }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: #1a1a2e;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }

  .btn-logout {
    background: none; border: 0.5px solid var(--color-border-secondary);
    border-radius: 6px; padding: 4px 10px;
    font-size: 12px; cursor: pointer; color: var(--color-text-secondary);
    font-family: 'Sora', sans-serif;
    transition: background 0.15s;
  }

  .btn-logout:hover { background: var(--color-background-secondary); }

  /* ---- DASHBOARD ---- */
  .dash-body { padding: 1.25rem; }

  .balance-card {
    background: #1a1a2e;
    border-radius: var(--border-radius-lg);
    padding: 1.5rem;
    color: #fff;
    margin-bottom: 1.25rem;
  }

  .balance-label {
    font-size: 12px; opacity: 0.6; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px;
  }

  .balance-amount {
    font-size: 32px; font-weight: 600; letter-spacing: -1px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 4px;
  }

  .balance-acct {
    font-size: 12px; opacity: 0.5; font-family: 'JetBrains Mono', monospace;
  }

  .balance-toggle {
    background: none; border: 0.5px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.7); border-radius: 6px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
    font-family: 'Sora', sans-serif;
    margin-top: 12px; transition: background 0.15s;
  }

  .balance-toggle:hover { background: rgba(255,255,255,0.1); }

  .action-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin-bottom: 1.25rem;
  }

  .action-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);
    padding: 12px 6px;
    cursor: pointer;
    transition: background 0.15s;
    font-family: 'Sora', sans-serif;
  }

  .action-btn:hover { background: var(--color-background-tertiary); }

  .action-icon { font-size: 20px; }

  .action-label {
    font-size: 11px; color: var(--color-text-secondary); font-weight: 500;
  }

  .section-title {
    font-size: 14px; font-weight: 500; margin-bottom: 10px;
    color: var(--color-text-primary);
  }

  .tx-list { display: flex; flex-direction: column; gap: 6px; }

  .tx-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);
  }

  .tx-icon {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  .tx-icon.credit { background: #eaf3de; }
  .tx-icon.debit  { background: #fcebeb; }

  .tx-info { flex: 1; }

  .tx-desc {
    font-size: 13px; font-weight: 500; color: var(--color-text-primary);
  }

  .tx-date {
    font-size: 11px; color: var(--color-text-secondary); margin-top: 2px;
  }

  .tx-amount {
    font-size: 14px; font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
  }

  .tx-amount.credit { color: #3B6D11; }
  .tx-amount.debit  { color: #A32D2D; }

  /* ---- MODAL ---- */
  .modal-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end;
    border-radius: var(--border-radius-lg);
    z-index: 10;
  }

  .modal-box {
    background: var(--color-background-primary);
    border-radius: 16px 16px 0 0;
    padding: 1.5rem;
    width: 100%;
    border-top: 0.5px solid var(--color-border-tertiary);
  }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .modal-title { font-size: 16px; font-weight: 500; }

  .btn-close {
    background: none; border: none; font-size: 18px;
    cursor: pointer; color: var(--color-text-secondary); line-height: 1;
  }

  .modal-msg {
    font-size: 13px; padding: 10px 12px;
    border-radius: var(--border-radius-md);
    margin-bottom: 1rem;
    display: none;
  }

  .modal-msg.success { background: #eaf3de; color: #3B6D11; display: block; }
  .modal-msg.error   { background: #fcebeb; color: #A32D2D; display: block; }

  /* ---- WRAPPER (relative for modal) ---- */
  .dash-wrapper { position: relative; }
</style>

<div class="bank-app">

  <!-- LOGIN -->
  <div id="screen-login" class="screen active">
    <div class="login-wrap">
      <div class="bank-logo">
        <div class="logo-icon">🏦</div>
        <div class="logo-name">NovoBanco</div>
        <div class="logo-sub">Digital Banking</div>
      </div>
      <div class="login-card">
        <div class="login-title">Acesso à conta</div>
        <div class="field">
          <label>CPF / Usuário</label>
          <input type="text" id="login-user" placeholder="000.000.000-00" value="usuario" />
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="login-pass" placeholder="••••••" value="1234" />
        </div>
        <button class="btn-primary" onclick="doLogin()">Entrar</button>
        <div class="login-hint">Use <b>usuario</b> / <b>1234</b> para entrar</div>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="screen-dash" class="screen">
    <div class="topbar">
      <div class="topbar-logo">🏦 NovoBanco</div>
      <div class="topbar-user">
        <div class="avatar" id="user-initials">JS</div>
        <span id="user-name-top">João Silva</span>
        <button class="btn-logout" onclick="doLogout()">Sair</button>
      </div>
    </div>

    <div class="dash-wrapper" id="dash-wrapper">
      <div class="dash-body">

        <!-- Saldo -->
        <div class="balance-card">
          <div class="balance-label">Saldo disponível</div>
          <div class="balance-amount" id="balance-display">R$ 4.820,00</div>
          <div class="balance-acct">Ag 0001 · CC 12345-6</div>
          <button class="balance-toggle" onclick="toggleBalance()">Ocultar</button>
        </div>

        <!-- Ações -->
        <div class="action-grid">
          <button class="action-btn" onclick="openModal('deposito')">
            <div class="action-icon">⬇️</div>
            <div class="action-label">Depósito</div>
          </button>
          <button class="action-btn" onclick="openModal('saque')">
            <div class="action-icon">⬆️</div>
            <div class="action-label">Saque</div>
          </button>
          <button class="action-btn" onclick="openModal('transferencia')">
            <div class="action-icon">↔️</div>
            <div class="action-label">Transferir</div>
          </button>
          <button class="action-btn" onclick="openModal('pix')">
            <div class="action-icon">⚡</div>
            <div class="action-label">Pix</div>
          </button>
        </div>

        <!-- Extrato -->
        <div class="section-title">Últimas transações</div>
        <div class="tx-list" id="tx-list"></div>
      </div>

      <!-- Modal overlay -->
      <div class="modal-overlay" id="modal-overlay" style="display:none;" onclick="closeModalOutside(event)">
        <div class="modal-box" id="modal-box">
          <div class="modal-header">
            <div class="modal-title" id="modal-title">Operação</div>
            <button class="btn-close" onclick="closeModal()">✕</button>
          </div>
          <div id="modal-msg" class="modal-msg"></div>
          <div id="modal-body"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const users = {
    usuario: { senha: '1234', nome: 'João Silva', saldo: 4820.00 }
  };

  let currentUser = null;
  let balanceVisible = true;
  let transactions = [
    { tipo: 'credit', desc: 'Salário', valor: 3500.00, data: '15/03/2026' },
    { tipo: 'debit',  desc: 'Mercado', valor: -320.50, data: '18/03/2026' },
    { tipo: 'credit', desc: 'Pix recebido', valor: 150.00, data: '20/03/2026' },
    { tipo: 'debit',  desc: 'Conta de luz', valor: -98.70, data: '22/03/2026' },
  ];

  function fmt(val) {
    return 'R$ ' + Math.abs(val).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function doLogin() {
    const u = document.getElementById('login-user').value.trim();
    const p = document.getElementById('login-pass').value;
    if (users[u] && users[u].senha === p) {
      currentUser = u;
      document.getElementById('screen-login').classList.remove('active');
      document.getElementById('screen-dash').classList.add('active');
      const nm = users[u].nome;
      document.getElementById('user-name-top').textContent = nm;
      document.getElementById('user-initials').textContent = nm.split(' ').map(w=>w[0]).slice(0,2).join('');
      renderBalance(); renderTx();
    } else {
      alert('Usuário ou senha incorretos.');
    }
  }

  function doLogout() {
    currentUser = null;
    document.getElementById('screen-dash').classList.remove('active');
    document.getElementById('screen-login').classList.add('active');
  }

  function renderBalance() {
    const u = users[currentUser];
    const el = document.getElementById('balance-display');
    el.textContent = balanceVisible ? fmt(u.saldo) : 'R$ ••••••';
  }

  function toggleBalance() {
    balanceVisible = !balanceVisible;
    const btn = document.querySelector('.balance-toggle');
    btn.textContent = balanceVisible ? 'Ocultar' : 'Mostrar';
    renderBalance();
  }

  function renderTx() {
    const list = document.getElementById('tx-list');
    list.innerHTML = [...transactions].reverse().map(tx => `
      <div class="tx-item">
        <div class="tx-icon ${tx.tipo}">${tx.tipo === 'credit' ? '⬇' : '⬆'}</div>
        <div class="tx-info">
          <div class="tx-desc">${tx.desc}</div>
          <div class="tx-date">${tx.data}</div>
        </div>
        <div class="tx-amount ${tx.tipo}">${tx.tipo === 'credit' ? '+' : '-'}${fmt(tx.valor)}</div>
      </div>
    `).join('');
  }

  let currentModal = null;

  function openModal(tipo) {
    currentModal = tipo;
    const titles = { deposito: 'Depósito', saque: 'Saque', transferencia: 'Transferência', pix: 'Pix' };
    document.getElementById('modal-title').textContent = titles[tipo];
    clearMsg();

    let extra = '';
    if (tipo === 'transferencia' || tipo === 'pix') {
      extra = `<div class="field"><label>${tipo === 'pix' ? 'Chave Pix' : 'Conta destino'}</label><input type="text" id="modal-dest" placeholder="${tipo === 'pix' ? 'CPF, e-mail ou telefone' : 'Ag / Conta'}" /></div>`;
    }

    document.getElementById('modal-body').innerHTML = `
      ${extra}
      <div class="field"><label>Valor (R$)</label><input type="number" id="modal-val" min="0.01" step="0.01" placeholder="0,00" /></div>
      <button class="btn-primary" onclick="doOp()" style="margin-top:0.25rem;">Confirmar</button>
    `;

    document.getElementById('modal-overlay').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modal-overlay').style.display = 'none';
    currentModal = null;
  }

  function closeModalOutside(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }

  function clearMsg() {
    const m = document.getElementById('modal-msg');
    m.className = 'modal-msg'; m.textContent = '';
  }

  function showMsg(text, type) {
    const m = document.getElementById('modal-msg');
    m.className = 'modal-msg ' + type; m.textContent = text;
  }

  function today() {
    const d = new Date();
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  }

  function doOp() {
    const val = parseFloat(document.getElementById('modal-val').value);
    if (!val || val <= 0) { showMsg('Informe um valor válido.', 'error'); return; }
    const u = users[currentUser];

    if (currentModal === 'deposito') {
      u.saldo += val;
      transactions.push({ tipo: 'credit', desc: 'Depósito', valor: val, data: today() });
      showMsg(`Depósito de ${fmt(val)} realizado com sucesso!`, 'success');
    } else if (currentModal === 'saque') {
      if (val > u.saldo) { showMsg('Saldo insuficiente.', 'error'); return; }
      u.saldo -= val;
      transactions.push({ tipo: 'debit', desc: 'Saque', valor: val, data: today() });
      showMsg(`Saque de ${fmt(val)} realizado com sucesso!`, 'success');
    } else if (currentModal === 'transferencia') {
      const dest = document.getElementById('modal-dest').value.trim();
      if (!dest) { showMsg('Informe a conta destino.', 'error'); return; }
      if (val > u.saldo) { showMsg('Saldo insuficiente.', 'error'); return; }
      u.saldo -= val;
      transactions.push({ tipo: 'debit', desc: `Transferência → ${dest}`, valor: val, data: today() });
      showMsg(`Transferência de ${fmt(val)} enviada!`, 'success');
    } else if (currentModal === 'pix') {
      const dest = document.getElementById('modal-dest').value.trim();
      if (!dest) { showMsg('Informe a chave Pix.', 'error'); return; }
      if (val > u.saldo) { showMsg('Saldo insuficiente.', 'error'); return; }
      u.saldo -= val;
      transactions.push({ tipo: 'debit', desc: `Pix → ${dest}`, valor: val, data: today() });
      showMsg(`Pix de ${fmt(val)} enviado com sucesso!`, 'success');
    }

    renderBalance(); renderTx();
    setTimeout(() => { closeModal(); clearMsg(); }, 2000);
  }
</script>
