<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Minhas Matérias — Clube de Estudos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,300&family=Instrument+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;
  --bg2:#0e0f18;
  --surface:#13141f;
  --surface2:#1a1b28;
  --surface3:#1f2133;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.12);
  --gold:#d4a843;
  --gold2:#f0c96a;
  --gold-dim:rgba(212,168,67,0.1);
  --gold-glow:rgba(212,168,67,0.3);
  --text:#edeae2;
  --text2:#9a9790;
  --text3:#52504a;
  --danger:#e05a5a;
  --success:#3ecf8e;
  --blue:#5b8af0;
  --purple:#9f7aea;
  --teal:#38b2ac;
  --rose:#e879a0;
  --orange:#f6a623;
  --sidebar-w:280px;
  --topbar-h:60px;
}

html,body{height:100%;overflow:hidden}
body{
  font-family:'Instrument Sans',sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;
}

/* ── TOPBAR ── */
.topbar{
  height:var(--topbar-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.5rem;
  background:rgba(9,9,15,0.9);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:50;
  position:relative;
}
.topbar::after{
  content:'';position:absolute;bottom:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0.2;
}
.brand{
  display:flex;align-items:center;gap:0.6rem;
  font-family:'Fraunces',serif;font-size:1.05rem;font-weight:700;
  color:var(--text);text-decoration:none;
}
.brand-dot{width:7px;height:7px;background:var(--gold);border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.brand span{color:var(--gold)}

.topbar-right{display:flex;align-items:center;gap:0.8rem}
.tb-btn{
  background:none;border:1px solid var(--border2);border-radius:9px;
  color:var(--text2);font-family:'Instrument Sans',sans-serif;
  font-size:0.75rem;font-weight:500;padding:0.45rem 1rem;
  cursor:pointer;display:flex;align-items:center;gap:0.45rem;
  transition:all 0.2s;letter-spacing:0.04em;
}
.tb-btn:hover{color:var(--text);border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.05)}
.tb-btn.primary{background:var(--gold);border-color:var(--gold);color:#09090f;font-weight:600}
.tb-btn.primary:hover{box-shadow:0 0 20px var(--gold-glow);transform:translateY(-1px)}
.tb-btn svg{width:13px;height:13px;flex-shrink:0}

.hamburger-btn{display:none;background:none;border:none;cursor:pointer;color:var(--text2);padding:4px}
.hamburger-btn svg{width:20px;height:20px}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  flex-shrink:0;overflow:hidden;
  transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.sidebar-head{
  padding:1.1rem 1.2rem 0.8rem;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.sidebar-title{
  font-size:0.65rem;text-transform:uppercase;letter-spacing:0.14em;
  color:var(--text3);font-weight:600;margin-bottom:0.7rem;
}
.search-box{
  display:flex;align-items:center;gap:0.5rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:9px;padding:0.5rem 0.7rem;
}
.search-box svg{width:13px;height:13px;color:var(--text3);flex-shrink:0}
.search-box input{
  background:none;border:none;outline:none;
  color:var(--text);font-family:'Instrument Sans',sans-serif;
  font-size:0.78rem;width:100%;
}
.search-box input::placeholder{color:var(--text3)}

.sidebar-list{flex:1;overflow-y:auto;padding:0.6rem}
.sidebar-list::-webkit-scrollbar{width:3px}
.sidebar-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}

.materia-item{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.65rem 0.7rem;border-radius:10px;
  cursor:pointer;transition:background 0.2s,transform 0.15s;
  margin-bottom:2px;user-select:none;
  position:relative;
}
.materia-item:hover{background:var(--surface)}
.materia-item.active{background:var(--surface2)}
.materia-item.active::before{
  content:'';position:absolute;left:0;top:20%;bottom:20%;
  width:2px;background:var(--gold);border-radius:2px;
}
.mat-color{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;flex-shrink:0;
}
.mat-info{flex:1;min-width:0}
.mat-name{
  font-size:0.82rem;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.2;
}
.mat-count{font-size:0.65rem;color:var(--text3);margin-top:1px}
.mat-opts{
  opacity:0;transition:opacity 0.15s;
  background:none;border:none;cursor:pointer;
  color:var(--text3);padding:2px;border-radius:5px;
  display:flex;
}
.mat-opts:hover{color:var(--text);background:rgba(255,255,255,0.08)}
.materia-item:hover .mat-opts{opacity:1}
.mat-opts svg{width:14px;height:14px}

.sidebar-empty{
  text-align:center;padding:2.5rem 1rem;
  color:var(--text3);font-size:0.8rem;line-height:1.7;
}
.sidebar-empty svg{width:36px;height:36px;margin-bottom:0.6rem;opacity:0.3}

/* ── MAIN AREA ── */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ── EMPTY STATE ── */
.empty-state{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:2rem;
  animation:fadeIn 0.5s both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.empty-icon{
  width:80px;height:80px;border-radius:20px;
  background:var(--gold-dim);border:1px solid rgba(212,168,67,0.15);
  display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;margin-bottom:1.4rem;
}
.empty-title{
  font-family:'Fraunces',serif;font-size:1.6rem;font-weight:700;
  margin-bottom:0.6rem;
}
.empty-sub{font-size:0.88rem;color:var(--text2);max-width:340px;line-height:1.7;margin-bottom:1.8rem}

/* ── MATERIA VIEW ── */
.materia-view{
  flex:1;overflow:hidden;display:flex;flex-direction:column;
  animation:fadeIn 0.35s both;
}
.mv-header{
  padding:1.4rem 2rem 1rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:0.8rem;flex-shrink:0;
  background:linear-gradient(to bottom, rgba(212,168,67,0.03), transparent);
}
.mv-header-left{display:flex;align-items:center;gap:0.9rem}
.mv-big-icon{
  width:46px;height:46px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;flex-shrink:0;
}
.mv-title-wrap{}
.mv-title{
  font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;
  line-height:1.1;
}
.mv-meta{font-size:0.72rem;color:var(--text2);margin-top:0.25rem}
.mv-actions{display:flex;gap:0.5rem;flex-wrap:wrap}

/* Tabs */
.mv-tabs{
  display:flex;gap:0;
  border-bottom:1px solid var(--border);
  padding:0 2rem;flex-shrink:0;
  overflow-x:auto;
}
.mv-tabs::-webkit-scrollbar{height:0}
.mv-tab{
  background:none;border:none;cursor:pointer;
  font-family:'Instrument Sans',sans-serif;
  font-size:0.78rem;font-weight:500;color:var(--text2);
  padding:0.75rem 1rem;position:relative;
  transition:color 0.2s;white-space:nowrap;
  letter-spacing:0.04em;
}
.mv-tab::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:2px;background:var(--gold);
  transform:scaleX(0);transition:transform 0.25s;
}
.mv-tab.active{color:var(--gold)}
.mv-tab.active::after{transform:scaleX(1)}
.mv-tab:hover{color:var(--text)}

/* Content area */
.mv-content{flex:1;overflow-y:auto;padding:1.5rem 2rem}
.mv-content::-webkit-scrollbar{width:4px}
.mv-content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}

/* TOPICS */
.topics-wrap{display:flex;flex-direction:column;gap:0.5rem}
.topic-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;
  transition:border-color 0.2s;
}
.topic-item:hover{border-color:var(--border2)}
.topic-head{
  display:flex;align-items:center;gap:0.8rem;
  padding:0.9rem 1.1rem;cursor:pointer;
  user-select:none;
}
.topic-num{
  font-family:'Fraunces',serif;font-size:0.85rem;font-weight:600;
  color:var(--text3);width:22px;text-align:center;flex-shrink:0;
}
.topic-title-text{flex:1;font-size:0.88rem;font-weight:500;line-height:1.3}
.topic-badges{display:flex;gap:0.35rem;align-items:center}
.topic-badge{
  font-size:0.6rem;font-weight:500;
  padding:0.2rem 0.5rem;border-radius:4px;
  letter-spacing:0.06em;text-transform:uppercase;
}
.badge-imp{background:rgba(212,168,67,0.15);color:var(--gold2)}
.badge-rev{background:rgba(62,207,142,0.15);color:var(--success)}
.badge-new{background:rgba(91,138,240,0.15);color:var(--blue)}

.topic-chevron{
  color:var(--text3);flex-shrink:0;
  transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);
}
.topic-chevron svg{width:14px;height:14px}
.topic-item.open .topic-chevron{transform:rotate(180deg)}

.topic-body{
  max-height:0;overflow:hidden;
  transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1);
}
.topic-item.open .topic-body{max-height:1200px}
.topic-body-inner{
  padding:0 1.1rem 1.1rem 3.1rem;
  border-top:1px solid var(--border);
}
.topic-text{
  font-size:0.83rem;color:var(--text2);
  line-height:1.8;white-space:pre-wrap;
  padding-top:0.9rem;
}
.topic-text strong{color:var(--text);font-weight:600}

.topic-actions{
  display:flex;gap:0.5rem;margin-top:0.9rem;
  padding-top:0.7rem;border-top:1px solid var(--border);
}
.tact-btn{
  background:none;border:1px solid var(--border);border-radius:7px;
  color:var(--text2);font-family:'Instrument Sans',sans-serif;
  font-size:0.7rem;font-weight:500;padding:0.3rem 0.7rem;
  cursor:pointer;display:flex;align-items:center;gap:0.3rem;
  transition:all 0.18s;letter-spacing:0.04em;
}
.tact-btn:hover{border-color:var(--border2);color:var(--text);background:rgba(255,255,255,0.04)}
.tact-btn.danger:hover{border-color:rgba(224,90,90,0.4);color:var(--danger)}
.tact-btn svg{width:12px;height:12px}

.add-topic-btn{
  display:flex;align-items:center;justify-content:center;gap:0.6rem;
  width:100%;padding:0.9rem;
  background:transparent;border:1px dashed rgba(255,255,255,0.1);
  border-radius:12px;color:var(--text3);
  font-family:'Instrument Sans',sans-serif;
  font-size:0.8rem;font-weight:500;cursor:pointer;
  transition:all 0.2s;margin-top:0.5rem;
  letter-spacing:0.04em;
}
.add-topic-btn:hover{border-color:rgba(212,168,67,0.35);color:var(--gold);background:var(--gold-dim)}
.add-topic-btn svg{width:14px;height:14px}

/* ANOTAÇÕES TAB */
.notes-area{
  width:100%;height:280px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;color:var(--text);
  font-family:'Instrument Sans',sans-serif;font-size:0.85rem;
  padding:1rem;line-height:1.8;resize:vertical;outline:none;
  transition:border-color 0.2s;
}
.notes-area:focus{border-color:rgba(212,168,67,0.35)}
.notes-area::placeholder{color:var(--text3)}
.notes-save{
  margin-top:0.7rem;float:right;
  background:var(--gold);border:none;border-radius:9px;
  color:#09090f;font-family:'Instrument Sans',sans-serif;
  font-size:0.78rem;font-weight:600;padding:0.55rem 1.2rem;
  cursor:pointer;transition:transform 0.15s,box-shadow 0.2s;
  letter-spacing:0.06em;
}
.notes-save:hover{transform:translateY(-1px);box-shadow:0 4px 16px var(--gold-glow)}

/* RESUMO TAB */
.resumo-empty{
  text-align:center;padding:3rem 1rem;
  color:var(--text3);font-size:0.82rem;
}

/* ── MODALS ── */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);
  z-index:200;display:flex;align-items:center;justify-content:center;
  padding:1rem;
  opacity:0;pointer-events:none;transition:opacity 0.25s;
}
.overlay.open{opacity:1;pointer-events:all}
.modal{
  background:var(--surface);
  border:1px solid rgba(212,168,67,0.18);
  border-radius:18px;padding:1.8rem;
  width:100%;max-width:480px;
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
  transform:scale(0.94) translateY(16px);
  transition:transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
  position:relative;
}
.overlay.open .modal{transform:scale(1) translateY(0)}
.modal-top{
  position:absolute;top:0;left:15%;right:15%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0.4;border-radius:1px;
}
.modal h3{
  font-family:'Fraunces',serif;font-size:1.2rem;font-weight:700;
  margin-bottom:1.4rem;
}
.field{margin-bottom:1rem}
label.lbl{
  display:block;font-size:0.68rem;font-weight:600;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text2);margin-bottom:0.45rem;
}
.inp{
  width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:9px;
  color:var(--text);font-family:'Instrument Sans',sans-serif;
  font-size:0.85rem;padding:0.65rem 0.9rem;outline:none;
  transition:border-color 0.2s,background 0.2s;
}
.inp:focus{border-color:rgba(212,168,67,0.35);background:rgba(212,168,67,0.04)}
.inp::placeholder{color:var(--text3)}
textarea.inp{resize:vertical;min-height:100px;line-height:1.7}

/* Emoji picker */
.emoji-grid{
  display:grid;grid-template-columns:repeat(8,1fr);
  gap:4px;max-height:130px;overflow-y:auto;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:9px;padding:6px;
}
.emoji-grid::-webkit-scrollbar{width:3px}
.emoji-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
.emoji-opt{
  aspect-ratio:1;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;cursor:pointer;
  transition:background 0.15s,transform 0.1s;
  border:2px solid transparent;
}
.emoji-opt:hover{background:rgba(255,255,255,0.08);transform:scale(1.15)}
.emoji-opt.sel{border-color:var(--gold);background:var(--gold-dim)}

/* Color picker */
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{
  width:28px;height:28px;border-radius:7px;
  cursor:pointer;border:2px solid transparent;
  transition:transform 0.15s,border-color 0.15s;
}
.color-opt:hover{transform:scale(1.15)}
.color-opt.sel{border-color:white}

/* Badge selector */
.badge-row{display:flex;gap:0.4rem;flex-wrap:wrap}
.badge-sel{
  font-size:0.68rem;font-weight:500;
  padding:0.25rem 0.65rem;border-radius:5px;
  cursor:pointer;border:1px solid var(--border);
  background:var(--surface2);color:var(--text2);
  transition:all 0.15s;letter-spacing:0.06em;text-transform:uppercase;
}
.badge-sel.active-gold{background:rgba(212,168,67,0.18);border-color:var(--gold);color:var(--gold2)}
.badge-sel.active-green{background:rgba(62,207,142,0.15);border-color:var(--success);color:var(--success)}
.badge-sel.active-blue{background:rgba(91,138,240,0.15);border-color:var(--blue);color:var(--blue)}

.modal-footer{
  display:flex;justify-content:flex-end;gap:0.6rem;
  margin-top:1.4rem;padding-top:1.1rem;
  border-top:1px solid var(--border);
}
.btn-cancel{
  background:none;border:1px solid var(--border);border-radius:9px;
  color:var(--text2);font-family:'Instrument Sans',sans-serif;
  font-size:0.8rem;font-weight:500;padding:0.6rem 1.2rem;
  cursor:pointer;transition:all 0.18s;
}
.btn-cancel:hover{border-color:var(--border2);color:var(--text)}
.btn-save{
  background:var(--gold);border:none;border-radius:9px;
  color:#09090f;font-family:'Instrument Sans',sans-serif;
  font-size:0.8rem;font-weight:600;padding:0.6rem 1.4rem;
  cursor:pointer;transition:all 0.2s;letter-spacing:0.04em;
}
.btn-save:hover{box-shadow:0 4px 18px var(--gold-glow);transform:translateY(-1px)}

/* ── CONFIRM DIALOG ── */
.confirm-box{
  background:var(--surface);border:1px solid rgba(224,90,90,0.25);
  border-radius:16px;padding:1.6rem;max-width:360px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  transform:scale(0.94);transition:transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
}
.overlay.open .confirm-box{transform:scale(1)}
.confirm-icon{font-size:2rem;margin-bottom:0.8rem}
.confirm-title{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:700;margin-bottom:0.5rem}
.confirm-sub{font-size:0.82rem;color:var(--text2);line-height:1.6;margin-bottom:1.2rem}
.confirm-btns{display:flex;gap:0.6rem;justify-content:flex-end}
.btn-danger{
  background:var(--danger);border:none;border-radius:9px;
  color:#fff;font-family:'Instrument Sans',sans-serif;
  font-size:0.8rem;font-weight:600;padding:0.6rem 1.2rem;
  cursor:pointer;transition:all 0.2s;
}
.btn-danger:hover{opacity:0.85}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:10px;padding:0.75rem 1.2rem;
  display:flex;align-items:center;gap:0.7rem;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
  z-index:500;font-size:0.8rem;white-space:nowrap;
  opacity:0;transition:transform 0.35s cubic-bezier(0.34,1.2,0.64,1),opacity 0.3s;
  pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── MOBILE ── */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);
  z-index:39;
}
@media(max-width:768px){
  :root{--sidebar-w:260px}
  .sidebar{
    position:fixed;top:var(--topbar-h);bottom:0;left:0;
    z-index:40;transform:translateX(-100%);
  }
  .sidebar.mobile-open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .hamburger-btn{display:flex}
  .mv-header{padding:1rem 1.2rem 0.8rem}
  .mv-content{padding:1rem 1.2rem}
  .mv-tabs{padding:0 1rem}
  .topbar{padding:0 1rem}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div style="display:flex;align-items:center;gap:0.8rem">
    <button class="hamburger-btn" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand"><div class="brand-dot"></div>Clube de <span>&nbsp;Estudos</span></div>
  </div>
  <div class="topbar-right">
    <button class="tb-btn" onclick="openModal('materia')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nova Matéria
    </button>
  </div>
</div>

<!-- SIDEBAR OVERLAY (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">Minhas Matérias</div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Buscar matéria..." id="searchInput" oninput="filterMaterias()"/>
      </div>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="mainArea">
    <!-- Empty state shown by JS -->
  </main>
</div>

<!-- MODAL: Nova/Editar Matéria -->
<div class="overlay" id="modalMateria">
  <div class="modal">
    <div class="modal-top"></div>
    <h3 id="modalMateriaTitle">Nova Matéria</h3>

    <div class="field">
      <label class="lbl">Nome da matéria</label>
      <input class="inp" id="mNome" type="text" placeholder="Ex: Matemática, Biologia..." maxlength="40"/>
    </div>

    <div class="field">
      <label class="lbl">Ícone</label>
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div class="field">
      <label class="lbl">Cor de destaque</label>
      <div class="color-row" id="colorRow"></div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('modalMateria')">Cancelar</button>
      <button class="btn-save" onclick="saveMateria()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: Novo/Editar Tópico -->
<div class="overlay" id="modalTopico">
  <div class="modal">
    <div class="modal-top"></div>
    <h3 id="modalTopicoTitle">Novo Tópico</h3>

    <div class="field">
      <label class="lbl">Título do tópico</label>
      <input class="inp" id="tTitulo" type="text" placeholder="Ex: Lei de Newton, Funções..." maxlength="80"/>
    </div>

    <div class="field">
      <label class="lbl">Conteúdo</label>
      <textarea class="inp" id="tConteudo" placeholder="Escreva o conteúdo, conceitos, fórmulas, exemplos..."></textarea>
    </div>

    <div class="field">
      <label class="lbl">Marcadores</label>
      <div class="badge-row">
        <span class="badge-sel" id="bImp" onclick="toggleBadge('imp')">⭐ Importante</span>
        <span class="badge-sel" id="bRev" onclick="toggleBadge('rev')">✅ Revisado</span>
        <span class="badge-sel" id="bNew" onclick="toggleBadge('new')">🔵 Novo</span>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('modalTopico')">Cancelar</button>
      <button class="btn-save" onclick="saveTopico()">Salvar</button>
    </div>
  </div>
</div>

<!-- CONFIRM -->
<div class="overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon" id="confirmIcon">🗑️</div>
    <div class="confirm-title" id="confirmTitle">Excluir?</div>
    <div class="confirm-sub" id="confirmSub">Tem certeza?</div>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeModal('confirmOverlay')">Cancelar</button>
      <button class="btn-danger" id="confirmBtn">Excluir</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><div class="toast-dot" id="toastDot"></div><span id="toastMsg"></span></div>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const EMOJIS = ['📚','📐','🔬','📝','🏛️','💻','🌍','⚗️','🧬','🔭','🎨','🎵','🧮','📊','🗺️','🌿','⚡','🧪','🏗️','🎭','🧠','📖','✏️','🔢','🌐','💡','🏺','📡'];
const COLORS = [
  {hex:'#d4a843',name:'gold'},
  {hex:'#5b8af0',name:'blue'},
  {hex:'#3ecf8e',name:'green'},
  {hex:'#e879a0',name:'rose'},
  {hex:'#9f7aea',name:'purple'},
  {hex:'#f6a623',name:'orange'},
  {hex:'#38b2ac',name:'teal'},
  {hex:'#e05a5a',name:'red'},
];

let state = {
  materias: [],       // [{id, nome, emoji, color, topicos:[{id,titulo,conteudo,badges:[],nota}], nota}]
  activeMateriaId: null,
  activeTab: 'topicos',
  editingMateriaId: null,
  editingTopicoId: null,
  selectedEmoji: EMOJIS[0],
  selectedColor: COLORS[0].hex,
  selectedBadges: [],
};

function loadState(){
  const s = localStorage.getItem('ce_materias_v2');
  if(s) state.materias = JSON.parse(s);
}
function saveState(){
  localStorage.setItem('ce_materias_v2', JSON.stringify(state.materias));
}
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6) }

// ═══════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════
function renderSidebar(filter=''){
  const list = document.getElementById('sidebarList');
  const filtered = state.materias.filter(m => m.nome.toLowerCase().includes(filter.toLowerCase()));

  if(state.materias.length === 0){
    list.innerHTML = `<div class="sidebar-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <div>Nenhuma matéria ainda.<br>Crie a primeira!</div>
    </div>`;
    return;
  }
  if(filtered.length === 0){
    list.innerHTML = `<div class="sidebar-empty"><div>Nenhuma matéria encontrada.</div></div>`;
    return;
  }

  list.innerHTML = filtered.map(m => {
    const active = m.id === state.activeMateriaId ? 'active' : '';
    const count = m.topicos.length;
    return `<div class="materia-item ${active}" onclick="selectMateria('${m.id}')" id="mat-${m.id}">
      <div class="mat-color" style="background:${m.color}22">${m.emoji}</div>
      <div class="mat-info">
        <div class="mat-name">${m.nome}</div>
        <div class="mat-count">${count} tópico${count!==1?'s':''}</div>
      </div>
      <button class="mat-opts" onclick="event.stopPropagation();openOptionsMenu('${m.id}',event)" title="Opções">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>`;
  }).join('');
}

function filterMaterias(){
  renderSidebar(document.getElementById('searchInput').value);
}

function selectMateria(id){
  state.activeMateriaId = id;
  state.activeTab = 'topicos';
  renderSidebar(document.getElementById('searchInput').value);
  renderMain();
  closeSidebar();
}

// ═══════════════════════════════════════════
// MAIN AREA
// ═══════════════════════════════════════════
function renderMain(){
  const area = document.getElementById('mainArea');
  if(!state.activeMateriaId || !state.materias.find(m=>m.id===state.activeMateriaId)){
    area.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📚</div>
      <div class="empty-title">Suas Matérias</div>
      <div class="empty-sub">Crie uma nova matéria e organize seus tópicos, anotações e resumos em um só lugar.</div>
      <button class="tb-btn primary" onclick="openModal('materia')" style="align-self:center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Criar primeira matéria
      </button>
    </div>`;
    return;
  }

  const m = state.materias.find(m=>m.id===state.activeMateriaId);
  const tabs = ['topicos','anotacoes','resumo'];
  const tabLabels = {topicos:'📋 Tópicos',anotacoes:'✏️ Anotações',resumo:'📊 Resumo'};

  area.innerHTML = `<div class="materia-view">
    <div class="mv-header">
      <div class="mv-header-left">
        <div class="mv-big-icon" style="background:${m.color}22">${m.emoji}</div>
        <div class="mv-title-wrap">
          <div class="mv-title">${m.nome}</div>
          <div class="mv-meta">${m.topicos.length} tópico${m.topicos.length!==1?'s':''} · Criada em ${m.criadaEm||'hoje'}</div>
        </div>
      </div>
      <div class="mv-actions">
        <button class="tb-btn" onclick="editMateria('${m.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Editar
        </button>
        <button class="tb-btn" style="color:var(--danger)" onclick="confirmDelete('materia','${m.id}','${m.nome}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          Excluir
        </button>
      </div>
    </div>

    <div class="mv-tabs">
      ${tabs.map(t=>`<button class="mv-tab ${t===state.activeTab?'active':''}" onclick="switchTab('${t}')">${tabLabels[t]}</button>`).join('')}
    </div>

    <div class="mv-content" id="mvContent">
      ${renderTab(m)}
    </div>
  </div>`;
}

function switchTab(tab){
  state.activeTab = tab;
  const m = state.materias.find(m=>m.id===state.activeMateriaId);
  if(!m) return;
  // update tab buttons
  document.querySelectorAll('.mv-tab').forEach(b=>b.classList.toggle('active', b.textContent.includes(tab==='topicos'?'Tópicos':tab==='anotacoes'?'Anotações':'Resumo')));
  document.getElementById('mvContent').innerHTML = renderTab(m);
}

function renderTab(m){
  if(state.activeTab === 'topicos') return renderTopicos(m);
  if(state.activeTab === 'anotacoes') return renderAnotacoes(m);
  return renderResumo(m);
}

// ── TÓPICOS ──
function renderTopicos(m){
  if(m.topicos.length === 0){
    return `<div style="text-align:center;padding:3rem 1rem;color:var(--text3)">
      <div style="font-size:2.5rem;margin-bottom:1rem">🗒️</div>
      <div style="font-size:0.88rem;margin-bottom:1.4rem">Nenhum tópico ainda.<br>Adicione o primeiro!</div>
      <button class="tb-btn primary" onclick="openTopicoModal()">+ Adicionar Tópico</button>
    </div>
    <button class="add-topic-btn" onclick="openTopicoModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Adicionar tópico
    </button>`;
  }

  const items = m.topicos.map((t,i)=>{
    const badges = [];
    if(t.badges?.includes('imp')) badges.push(`<span class="topic-badge badge-imp">⭐ Importante</span>`);
    if(t.badges?.includes('rev')) badges.push(`<span class="topic-badge badge-rev">✅ Revisado</span>`);
    if(t.badges?.includes('new')) badges.push(`<span class="topic-badge badge-new">🔵 Novo</span>`);

    const preview = t.conteudo ? t.conteudo.slice(0,120)+(t.conteudo.length>120?'…':'') : '<em style="color:var(--text3)">Sem conteúdo</em>';

    return `<div class="topic-item" id="top-${t.id}">
      <div class="topic-head" onclick="toggleTopico('${t.id}')">
        <div class="topic-num">${String(i+1).padStart(2,'0')}</div>
        <div class="topic-title-text">${t.titulo}</div>
        <div class="topic-badges">${badges.join('')}</div>
        <div class="topic-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="topic-body">
        <div class="topic-body-inner">
          <div class="topic-text">${t.conteudo || '<em style="color:var(--text3)">Nenhum conteúdo adicionado.</em>'}</div>
          <div class="topic-actions">
            <button class="tact-btn" onclick="editTopico('${t.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Editar
            </button>
            <button class="tact-btn danger" onclick="confirmDelete('topico','${t.id}','${t.titulo}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
              Excluir
            </button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  return `<div class="topics-wrap">${items}</div>
    <button class="add-topic-btn" onclick="openTopicoModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Adicionar novo tópico
    </button>`;
}

function toggleTopico(id){
  const el = document.getElementById('top-'+id);
  if(!el) return;
  el.classList.toggle('open');
}

// ── ANOTAÇÕES ──
function renderAnotacoes(m){
  const val = m.nota||'';
  return `<div>
    <div style="font-size:0.78rem;color:var(--text2);margin-bottom:0.8rem;line-height:1.6">
      📝 Espaço livre para anotações, dúvidas, lembretes e fórmulas desta matéria.
    </div>
    <textarea class="notes-area" id="notesArea" placeholder="Escreva aqui suas anotações, fórmulas, dicas e qualquer coisa que queira guardar sobre ${m.nome}...">${val}</textarea>
    <button class="notes-save" onclick="saveNota()">Salvar Anotações</button>
  </div>`;
}

function saveNota(){
  const m = state.materias.find(m=>m.id===state.activeMateriaId);
  if(!m) return;
  m.nota = document.getElementById('notesArea').value;
  saveState();
  toast('Anotações salvas!','var(--success)');
}

// ── RESUMO ──
function renderResumo(m){
  const total = m.topicos.length;
  const revisados = m.topicos.filter(t=>t.badges?.includes('rev')).length;
  const importantes = m.topicos.filter(t=>t.badges?.includes('imp')).length;
  const novos = m.topicos.filter(t=>t.badges?.includes('new')).length;
  const comConteudo = m.topicos.filter(t=>t.conteudo && t.conteudo.trim().length>0).length;
  const pct = total>0?Math.round((revisados/total)*100):0;

  if(total===0){
    return `<div class="resumo-empty">
      <div style="font-size:2.5rem;margin-bottom:1rem">📊</div>
      <div>Adicione tópicos para ver o resumo de progresso.</div>
    </div>`;
  }

  const barW = pct+'%';
  const topicosLista = m.topicos.map(t=>{
    const b = [];
    if(t.badges?.includes('imp')) b.push('⭐');
    if(t.badges?.includes('rev')) b.push('✅');
    if(t.badges?.includes('new')) b.push('🔵');
    return `<div style="display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0;border-bottom:1px solid var(--border)">
      <div style="font-size:0.82rem;flex:1;color:var(--text2)">${t.titulo}</div>
      <div style="display:flex;gap:3px;font-size:0.8rem">${b.join('')||'—'}</div>
    </div>`;
  }).join('');

  return `<div style="display:flex;flex-direction:column;gap:1.4rem">

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0.8rem">
      ${statCard('📋','Total de Tópicos',total,'var(--gold)')}
      ${statCard('✅','Revisados',revisados,'var(--success)')}
      ${statCard('⭐','Importantes',importantes,'var(--gold)')}
      ${statCard('🔵','Novos',novos,'var(--blue)')}
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.2rem">
      <div style="display:flex;justify-content:space-between;font-size:0.78rem;margin-bottom:0.6rem">
        <span style="color:var(--text2)">Progresso de revisão</span>
        <span style="color:var(--gold);font-weight:600">${pct}%</span>
      </div>
      <div style="height:8px;background:rgba(255,255,255,0.07);border-radius:4px">
        <div style="height:100%;width:${barW};background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:4px;transition:width 0.8s"></div>
      </div>
      <div style="font-size:0.72rem;color:var(--text3);margin-top:0.5rem">${revisados} de ${total} tópicos revisados · ${comConteudo} com conteúdo</div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.2rem">
      <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:0.6rem;font-weight:600">Todos os tópicos</div>
      ${topicosLista}
    </div>
  </div>`;
}

function statCard(emoji,label,val,color){
  return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center">
    <div style="font-size:1.4rem;margin-bottom:0.3rem">${emoji}</div>
    <div style="font-family:'Fraunces',serif;font-size:1.6rem;font-weight:700;color:${color};line-height:1">${val}</div>
    <div style="font-size:0.68rem;color:var(--text3);margin-top:0.25rem;letter-spacing:0.06em;text-transform:uppercase">${label}</div>
  </div>`;
}

// ═══════════════════════════════════════════
// MODAIS — MATÉRIA
// ═══════════════════════════════════════════
function buildEmojiGrid(){
  document.getElementById('emojiGrid').innerHTML = EMOJIS.map(e=>
    `<div class="emoji-opt ${e===state.selectedEmoji?'sel':''}" onclick="selectEmoji('${e}')">${e}</div>`
  ).join('');
}
function buildColorRow(){
  document.getElementById('colorRow').innerHTML = COLORS.map(c=>
    `<div class="color-opt ${c.hex===state.selectedColor?'sel':''}" style="background:${c.hex}" onclick="selectColor('${c.hex}')" title="${c.name}"></div>`
  ).join('');
}
function selectEmoji(e){
  state.selectedEmoji = e;
  document.querySelectorAll('.emoji-opt').forEach(el=>el.classList.toggle('sel', el.textContent===e));
}
function selectColor(hex){
  state.selectedColor = hex;
  document.querySelectorAll('.color-opt').forEach(el=>el.classList.toggle('sel', el.style.background===hex||el.style.backgroundColor===hex));
}

function openModal(type){
  if(type==='materia'){
    state.editingMateriaId = null;
    state.selectedEmoji = EMOJIS[0];
    state.selectedColor = COLORS[0].hex;
    document.getElementById('mNome').value = '';
    document.getElementById('modalMateriaTitle').textContent = 'Nova Matéria';
    buildEmojiGrid();
    buildColorRow();
    document.getElementById('modalMateria').classList.add('open');
    setTimeout(()=>document.getElementById('mNome').focus(),350);
  }
}

function editMateria(id){
  const m = state.materias.find(m=>m.id===id);
  if(!m) return;
  state.editingMateriaId = id;
  state.selectedEmoji = m.emoji;
  state.selectedColor = m.color;
  document.getElementById('mNome').value = m.nome;
  document.getElementById('modalMateriaTitle').textContent = 'Editar Matéria';
  buildEmojiGrid();
  buildColorRow();
  document.getElementById('modalMateria').classList.add('open');
  setTimeout(()=>document.getElementById('mNome').focus(),350);
}

function saveMateria(){
  const nome = document.getElementById('mNome').value.trim();
  if(!nome){ shake('mNome'); return; }

  if(state.editingMateriaId){
    const m = state.materias.find(m=>m.id===state.editingMateriaId);
    m.nome = nome; m.emoji = state.selectedEmoji; m.color = state.selectedColor;
    toast('Matéria atualizada!','var(--success)');
  } else {
    const now = new Date();
    state.materias.push({
      id:genId(), nome, emoji:state.selectedEmoji, color:state.selectedColor,
      topicos:[], nota:'',
      criadaEm: now.toLocaleDateString('pt-BR')
    });
    state.activeMateriaId = state.materias[state.materias.length-1].id;
    toast('Matéria criada!','var(--gold)');
  }
  saveState();
  closeModal('modalMateria');
  renderSidebar();
  renderMain();
}

// ═══════════════════════════════════════════
// MODAIS — TÓPICO
// ═══════════════════════════════════════════
function toggleBadge(b){
  const el = document.getElementById('b'+b.charAt(0).toUpperCase()+b.slice(1));
  const idx = state.selectedBadges.indexOf(b);
  if(idx>=0){ state.selectedBadges.splice(idx,1); el.className='badge-sel'; }
  else {
    state.selectedBadges.push(b);
    el.className = 'badge-sel '+(b==='imp'?'active-gold':b==='rev'?'active-green':'active-blue');
  }
}

function openTopicoModal(){
  state.editingTopicoId = null;
  state.selectedBadges = [];
  document.getElementById('tTitulo').value = '';
  document.getElementById('tConteudo').value = '';
  document.getElementById('modalTopicoTitle').textContent = 'Novo Tópico';
  ['Imp','Rev','New'].forEach(b=>document.getElementById('b'+b).className='badge-sel');
  document.getElementById('modalTopico').classList.add('open');
  setTimeout(()=>document.getElementById('tTitulo').focus(),350);
}

function editTopico(id){
  const m = state.materias.find(m=>m.id===state.activeMateriaId);
  const t = m.topicos.find(t=>t.id===id);
  if(!t) return;
  state.editingTopicoId = id;
  state.selectedBadges = [...(t.badges||[])];
  document.getElementById('tTitulo').value = t.titulo;
  document.getElementById('tConteudo').value = t.conteudo||'';
  document.getElementById('modalTopicoTitle').textContent = 'Editar Tópico';
  // reset badges UI
  ['imp','rev','new'].forEach(b=>{
    const el = document.getElementById('b'+b.charAt(0).toUpperCase()+b.slice(1));
    if(state.selectedBadges.includes(b)){
      el.className='badge-sel '+(b==='imp'?'active-gold':b==='rev'?'active-green':'active-blue');
    } else { el.className='badge-sel'; }
  });
  document.getElementById('modalTopico').classList.add('open');
  setTimeout(()=>document.getElementById('tTitulo').focus(),350);
}

function saveTopico(){
  const titulo = document.getElementById('tTitulo').value.trim();
  if(!titulo){ shake('tTitulo'); return; }
  const conteudo = document.getElementById('tConteudo').value.trim();
  const m = state.materias.find(m=>m.id===state.activeMateriaId);
  if(!m) return;

  if(state.editingTopicoId){
    const t = m.topicos.find(t=>t.id===state.editingTopicoId);
    t.titulo = titulo; t.conteudo = conteudo; t.badges = [...state.selectedBadges];
    toast('Tópico atualizado!','var(--success)');
  } else {
    m.topicos.push({ id:genId(), titulo, conteudo, badges:[...state.selectedBadges] });
    toast('Tópico adicionado!','var(--gold)');
  }
  saveState();
  closeModal('modalTopico');
  renderMain();
}

// ═══════════════════════════════════════════
// DELETE / CONFIRM
// ═══════════════════════════════════════════
let pendingDelete = null;

function confirmDelete(type, id, nome){
  pendingDelete = {type, id};
  const isMat = type==='materia';
  document.getElementById('confirmIcon').textContent = isMat ? '🗑️' : '⚠️';
  document.getElementById('confirmTitle').textContent = isMat ? 'Excluir matéria?' : 'Excluir tópico?';
  document.getElementById('confirmSub').textContent = isMat
    ? `"${nome}" e todos os seus tópicos serão removidos permanentemente.`
    : `O tópico "${nome}" será removido permanentemente.`;
  document.getElementById('confirmBtn').onclick = executarDelete;
  document.getElementById('confirmOverlay').classList.add('open');
}

function executarDelete(){
  if(!pendingDelete) return;
  const {type,id} = pendingDelete;
  if(type==='materia'){
    const idx = state.materias.findIndex(m=>m.id===id);
    state.materias.splice(idx,1);
    if(state.activeMateriaId===id) state.activeMateriaId = state.materias[0]?.id||null;
    toast('Matéria excluída','var(--danger)');
  } else {
    const m = state.materias.find(m=>m.id===state.activeMateriaId);
    const idx = m.topicos.findIndex(t=>t.id===id);
    m.topicos.splice(idx,1);
    toast('Tópico excluído','var(--danger)');
  }
  saveState();
  pendingDelete = null;
  closeModal('confirmOverlay');
  renderSidebar();
  renderMain();
}

// ═══════════════════════════════════════════
// OPTIONS MENU (sidebar)
// ═══════════════════════════════════════════
let optMenu = null;
function openOptionsMenu(id, e){
  closeOptionsMenu();
  const m = state.materias.find(m=>m.id===id);
  const menu = document.createElement('div');
  menu.id = 'optMenu';
  menu.style.cssText = `position:fixed;z-index:300;background:var(--surface2);border:1px solid var(--border2);
    border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,0.5);padding:4px;min-width:140px;
    animation:fadeIn 0.15s both;`;
  const items = [
    {icon:'✏️',label:'Editar',action:`editMateria('${id}');closeOptionsMenu()`},
    {icon:'🗑️',label:'Excluir',action:`confirmDelete('materia','${id}','${m.nome}');closeOptionsMenu()`,danger:true},
  ];
  menu.innerHTML = items.map(i=>
    `<div onclick="${i.action}" style="padding:0.5rem 0.8rem;border-radius:7px;cursor:pointer;font-size:0.8rem;
      display:flex;align-items:center;gap:0.5rem;transition:background 0.15s;
      color:${i.danger?'var(--danger)':'var(--text)'};"
      onmouseenter="this.style.background='rgba(255,255,255,0.06)'"
      onmouseleave="this.style.background=''"
    >${i.icon} ${i.label}</div>`
  ).join('');
  document.body.appendChild(menu);
  const rect = e.target.getBoundingClientRect();
  menu.style.top = (rect.bottom+4)+'px';
  menu.style.left = Math.min(rect.left, window.innerWidth-160)+'px';
  optMenu = menu;
  setTimeout(()=>document.addEventListener('click',closeOptionsMenu,{once:true}),50);
}
function closeOptionsMenu(){ if(optMenu){optMenu.remove();optMenu=null;} }

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function closeModal(id){
  document.getElementById(id).classList.remove('open');
}

function shake(id){
  const el = document.getElementById(id);
  el.style.borderColor='var(--danger)';
  el.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(-3px)'},{transform:'translateX(0)'}],{duration:300});
  setTimeout(()=>el.style.borderColor='',1200);
}

let toastTimer2;
function toast(msg, color='var(--gold)'){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastDot').style.background = color;
  clearTimeout(toastTimer2);
  t.classList.add('show');
  toastTimer2 = setTimeout(()=>t.classList.remove('show'), 2800);
}

// Mobile sidebar
function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebarOverlay');
  sb.classList.toggle('mobile-open');
  ov.classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// Keyboard shortcuts
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='k') { openModal('materia'); e.preventDefault(); }
  if(e.key==='Escape'){
    closeModal('modalMateria'); closeModal('modalTopico'); closeModal('confirmOverlay'); closeOptionsMenu();
  }
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){
    if(document.getElementById('modalTopico').classList.contains('open')) saveTopico();
    if(document.getElementById('modalMateria').classList.contains('open')) saveMateria();
  }
});

// Close modals clicking overlay bg
['modalMateria','modalTopico'].forEach(id=>{
  document.getElementById(id).addEventListener('click',function(e){
    if(e.target===this) closeModal(id);
  });
});
document.getElementById('confirmOverlay').addEventListener('click',function(e){
  if(e.target===this) closeModal('confirmOverlay');
});

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
loadState();
renderSidebar();
renderMain();
</script>
</body>
</html>
