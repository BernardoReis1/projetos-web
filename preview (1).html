<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hero Moderno</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:#f6cfc9;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .hero{
      width:100%;
      max-width:1200px;
      background:#fff;
      border-radius:24px;
      overflow:hidden;
      padding:40px 60px;
      box-shadow:0 20px 60px rgba(0,0,0,.08);

      display:grid;
      grid-template-columns:1fr 1fr;
      align-items:center;
      gap:40px;

      position:relative;
    }

    /* NAV */

    .top{
      position:absolute;
      top:25px;
      left:60px;
      right:60px;

      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo{
      font-size:1.2rem;
      font-weight:700;
      color:#12343b;
    }

    .menu{
      display:flex;
      gap:35px;
    }

    .menu a{
      text-decoration:none;
      color:#777;
      font-size:.95rem;
      transition:.3s;
    }

    .menu a:hover{
      color:#10b4ad;
    }

    .btn-nav{
      padding:10px 22px;
      border:1px solid #10b4ad;
      border-radius:999px;
      color:#10b4ad;
      text-decoration:none;
      font-weight:600;
      transition:.3s;
    }

    .btn-nav:hover{
      background:#10b4ad;
      color:white;
    }

    /* LEFT */

    .content{
      padding-top:80px;
    }

    .line{
      width:90px;
      height:2px;
      background:#7fa3a1;
      margin-bottom:30px;
    }

    .content h1{
      font-size:clamp(2rem,5vw,4rem);
      line-height:1.1;
      color:#14213d;
      max-width:500px;
      margin-bottom:35px;
    }

    .buttons{
      display:flex;
      gap:18px;
      flex-wrap:wrap;
    }

    .btn-primary{
      background:#10b4ad;
      color:white;
      padding:14px 28px;
      border-radius:999px;
      text-decoration:none;
      font-weight:600;
      transition:.3s;
    }

    .btn-primary:hover{
      transform:translateY(-3px);
      box-shadow:0 10px 25px rgba(16,180,173,.3);
    }

    .btn-video{
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color:#444;
      font-weight:500;
    }

    .play{
      width:45px;
      height:45px;
      border-radius:50%;
      background:white;
      border:1px solid #ddd;

      display:flex;
      align-items:center;
      justify-content:center;

      box-shadow:0 5px 15px rgba(0,0,0,.08);
    }

    /* RIGHT */

    .image-area{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .circle{
      width:420px;
      height:420px;
      border:2px solid rgba(16,180,173,.2);
      border-radius:50%;
      position:absolute;
    }

    .circle::before{
      content:"";
      position:absolute;
      inset:25px;
      border:2px dashed rgba(16,180,173,.2);
      border-radius:50%;
    }

    .profile{
      width:100%;
      max-width:420px;
      position:relative;
      z-index:2;
      border-radius:20px;
      object-fit:cover;
    }

    .floating{
      position:absolute;
      width:55px;
      height:55px;
      border-radius:16px;
      background:white;

      display:flex;
      align-items:center;
      justify-content:center;

      box-shadow:0 10px 30px rgba(0,0,0,.08);

      z-index:5;
    }

    .f1{
      top:50px;
      left:20px;
    }

    .f2{
      right:40px;
      top:100px;
    }

    .f3{
      bottom:40px;
      left:50px;
    }

    .floating span{
      color:#10b4ad;
      font-size:1.4rem;
      font-weight:700;
    }

    /* RESPONSIVO */

    @media(max-width:992px){

      .hero{
        grid-template-columns:1fr;
        padding:120px 35px 50px;
        text-align:center;
      }

      .top{
        left:35px;
        right:35px;
      }

      .content{
        order:2;
      }

      .content h1{
        margin-inline:auto;
      }

      .buttons{
        justify-content:center;
      }

      .image-area{
        order:1;
      }

    }

    @media(max-width:768px){

      .menu{
        display:none;
      }

      .circle{
        width:300px;
        height:300px;
      }

      .profile{
        max-width:280px;
      }

      .floating{
        width:45px;
        height:45px;
      }

    }

    @media(max-width:480px){

      .hero{
        padding:100px 20px 40px;
      }

      .top{
        left:20px;
        right:20px;
      }

      .content h1{
        font-size:2.2rem;
      }

      .buttons{
        flex-direction:column;
        align-items:center;
      }

      .btn-primary{
        width:100%;
        text-align:center;
      }

    }

  </style>
</head>
<body>

  <section class="hero">

    <!-- NAV -->
    <div class="top">

      <div class="logo">
        Mindful
      </div>

      <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </div>

      <a href="#" class="btn-nav">
        Login
      </a>

    </div>

    <!-- LEFT -->
    <div class="content">

      <div class="line"></div>

      <h1>
        The peace you need starts deep in your mind.
      </h1>

      <div class="buttons">

        <a href="#" class="btn-primary">
          Get Started
        </a>

        <a href="#" class="btn-video">

          <div class="play">
            ▶
          </div>

          Watch Video

        </a>

      </div>

    </div>

    <!-- RIGHT -->
    <div class="image-area">

      <div class="circle"></div>

      <div class="floating f1">
        <span>+</span>
      </div>

      <div class="floating f2">
        <span>○</span>
      </div>

      <div class="floating f3">
        <span>✦</span>
      </div>

      <img
        class="profile"
        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=1200&auto=format&fit=crop"
        alt="Profile"
      />

    </div>

  </section>

</body>
</html>
