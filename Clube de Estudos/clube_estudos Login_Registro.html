<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clube de Estudos</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0e14;
      --surface: #11151e;
      --card: #161b27;
      --border: rgba(255,255,255,0.07);
      --border-glow: rgba(196,161,90,0.35);
      --gold: #c4a15a;
      --gold-light: #e2c77e;
      --gold-dim: rgba(196,161,90,0.15);
      --text: #e8e2d6;
      --muted: #7a7870;
      --error: #e05c5c;
      --success: #5cbf8a;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(196,161,90,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 80% 80%, rgba(100,120,180,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grid texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: orbFloat 12s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 300px; height: 300px;
      background: rgba(196,161,90,0.07);
      top: -80px; left: -80px;
      animation-duration: 14s;
    }
    .orb-2 {
      width: 250px; height: 250px;
      background: rgba(80,100,200,0.05);
      bottom: -60px; right: -60px;
      animation-duration: 10s;
      animation-delay: -5s;
    }
    @keyframes orbFloat {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.1); }
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow:
        0 0 0 1px rgba(196,161,90,0.08),
        0 40px 80px rgba(0,0,0,0.5),
        0 0 60px rgba(196,161,90,0.04);
      animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }

    /* Gold top line */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: 1px;
      opacity: 0.6;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px; height: 52px;
      background: linear-gradient(135deg, rgba(196,161,90,0.2), rgba(196,161,90,0.05));
      border: 1px solid rgba(196,161,90,0.3);
      border-radius: 14px;
      margin-bottom: 1rem;
      position: relative;
    }
    .logo-icon svg {
      width: 26px; height: 26px;
    }

    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1.1;
    }
    .brand span {
      color: var(--gold);
    }

    .tagline {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    /* Tab switcher */
    .tabs {
      display: flex;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 1.8rem;
      position: relative;
    }

    .tab-indicator {
      position: absolute;
      top: 3px; bottom: 3px;
      width: calc(50% - 3px);
      background: linear-gradient(135deg, rgba(196,161,90,0.22), rgba(196,161,90,0.10));
      border: 1px solid rgba(196,161,90,0.25);
      border-radius: 8px;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      left: 3px;
    }
    .tabs.register .tab-indicator {
      transform: translateX(calc(100% + 3px));
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 0.55rem 0;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      cursor: pointer;
      position: relative;
      z-index: 1;
      transition: color 0.3s;
      color: var(--muted);
    }
    .tab-btn.active { color: var(--gold-light); }

    /* Forms container */
    .forms-wrap {
      position: relative;
      overflow: hidden;
    }

    .form-panel {
      transition: opacity 0.35s, transform 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    .form-panel.hidden {
      display: none;
    }

    /* Field */
    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    .input-wrap {
      position: relative;
    }
    .input-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px; height: 15px;
      color: var(--muted);
      pointer-events: none;
      transition: color 0.2s;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      padding: 0.7rem 0.9rem 0.7rem 2.4rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    input::placeholder { color: rgba(122,120,112,0.6); font-size: 0.82rem; }
    input:focus {
      border-color: var(--border-glow);
      background: rgba(196,161,90,0.04);
      box-shadow: 0 0 0 3px rgba(196,161,90,0.08), 0 2px 12px rgba(0,0,0,0.2);
    }
    input:focus ~ svg, .input-wrap:focus-within svg {
      color: var(--gold);
    }

    /* Password toggle */
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 2px;
      display: flex;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--gold); }
    .toggle-pw svg { width: 15px; height: 15px; }

    /* Forgot */
    .forgot {
      text-align: right;
      margin-top: -0.4rem;
      margin-bottom: 1rem;
    }
    .forgot a {
      font-size: 0.72rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .forgot a:hover { color: var(--gold); }

    /* Submit button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #c4a15a, #9e7d3a);
      border: none;
      border-radius: 10px;
      color: #0b0e14;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.78rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.25s, opacity 0.2s;
      margin-top: 0.4rem;
      box-shadow: 0 4px 20px rgba(196,161,90,0.25);
    }
    .btn-submit::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 60%);
      pointer-events: none;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(196,161,90,0.38);
    }
    .btn-submit:active { transform: translateY(0); opacity: 0.9; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin: 1.2rem 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* Social btn */
    .btn-social {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 400;
      padding: 0.65rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      transition: border-color 0.25s, background 0.25s;
    }
    .btn-social:hover {
      border-color: rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
    }
    .btn-social svg { width: 16px; height: 16px; }

    /* Message */
    .msg {
      font-size: 0.75rem;
      text-align: center;
      margin-top: 1rem;
      min-height: 1rem;
      transition: opacity 0.3s;
    }
    .msg.error { color: var(--error); }
    .msg.success { color: var(--success); }
    .msg:empty { opacity: 0; }

    /* Footer note */
    .footer-note {
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      letter-spacing: 0.04em;
    }

    /* Loader spinner inside button */
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #0b0e14;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive tweaks */
    @media (max-width: 380px) {
      .card { padding: 2rem 1.4rem; }
      .brand { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold)">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div class="brand">Clube de <span>Estudos</span></div>
      <div class="tagline" id="pageTagline">Acesso à plataforma</div>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabsEl">
      <div class="tab-indicator"></div>
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Cadastro</button>
    </div>

    <!-- LOGIN FORM -->
    <div class="forms-wrap">
      <div class="form-panel" id="formLogin">
        <div class="field">
          <label>E-mail</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email"/>
          </div>
        </div>
        <div class="field">
          <label>Senha</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"/>
            <button class="toggle-pw" type="button" onclick="togglePw('loginPassword', this)" aria-label="Ver senha">
              <svg id="eyeLogin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="forgot"><a href="#">Esqueceu a senha?</a></div>
        <button class="btn-submit" onclick="handleLogin()">Entrar</button>
        <div class="divider"><span>ou continue com</span></div>
        <button class="btn-social">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Entrar com Google
        </button>
        <div class="msg" id="msgLogin"></div>
      </div>

      <!-- REGISTER FORM -->
      <div class="form-panel hidden" id="formRegister">
        <div class="field">
          <label>Nome completo</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="regName" placeholder="Seu nome" autocomplete="name"/>
          </div>
        </div>
        <div class="field">
          <label>E-mail</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input type="email" id="regEmail" placeholder="seu@email.com" autocomplete="email"/>
          </div>
        </div>
        <div class="field">
          <label>Senha</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="regPassword" placeholder="Mín. 6 caracteres" autocomplete="new-password"/>
            <button class="toggle-pw" type="button" onclick="togglePw('regPassword', this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label>Confirmar senha</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <input type="password" id="regConfirm" placeholder="Repita a senha" autocomplete="new-password"/>
          </div>
        </div>
        <button class="btn-submit" onclick="handleRegister()">Criar conta</button>
        <div class="msg" id="msgRegister"></div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-note">
      &copy; 2025 Clube de Estudos &mdash; Todos os direitos reservados
    </div>
  </div>

  <script>
    let currentTab = 'login';
    const users = JSON.parse(localStorage.getItem('ce_users') || '[]');

    function switchTab(tab) {
      if (currentTab === tab) return;
      currentTab = tab;

      const tabs = document.getElementById('tabsEl');
      const tabLogin = document.getElementById('tabLogin');
      const tabReg = document.getElementById('tabRegister');
      const fLogin = document.getElementById('formLogin');
      const fReg = document.getElementById('formRegister');
      const tagline = document.getElementById('pageTagline');

      clearMsg('msgLogin');
      clearMsg('msgRegister');

      if (tab === 'login') {
        tabs.classList.remove('register');
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
        fLogin.classList.remove('hidden');
        fReg.classList.add('hidden');
        tagline.textContent = 'Acesso à plataforma';
      } else {
        tabs.classList.add('register');
        tabLogin.classList.remove('active');
        tabReg.classList.add('active');
        fLogin.classList.add('hidden');
        fReg.classList.remove('hidden');
        tagline.textContent = 'Crie sua conta agora';
      }
    }

    function togglePw(id, btn) {
      const inp = document.getElementById(id);
      const isHidden = inp.type === 'password';
      inp.type = isHidden ? 'text' : 'password';
      btn.querySelector('svg').innerHTML = isHidden
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg ' + type;
    }
    function clearMsg(id) {
      const el = document.getElementById(id);
      el.textContent = '';
      el.className = 'msg';
    }

    function setLoading(btn, loading) {
      btn.disabled = loading;
      btn.innerHTML = loading ? '<span class="spinner"></span>' : btn.dataset.label;
    }

    function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;
      const btn = document.querySelector('#formLogin .btn-submit');
      if (!btn.dataset.label) btn.dataset.label = btn.textContent;

      clearMsg('msgLogin');

      if (!email || !pass) {
        showMsg('msgLogin', 'Preencha todos os campos.', 'error'); return;
      }
      if (!isValidEmail(email)) {
        showMsg('msgLogin', 'E-mail inválido.', 'error'); return;
      }

      setLoading(btn, true);
      setTimeout(() => {
        setLoading(btn, false);
        const stored = JSON.parse(localStorage.getItem('ce_users') || '[]');
        const user = stored.find(u => u.email === email && u.pass === pass);
        if (user) {
          showMsg('msgLogin', `✓ Bem-vindo(a) de volta, ${user.name}!`, 'success');
          document.getElementById('loginPassword').value = '';
        } else {
          showMsg('msgLogin', 'E-mail ou senha incorretos.', 'error');
        }
      }, 900);
    }

    function handleRegister() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      const btn = document.querySelector('#formRegister .btn-submit');
      if (!btn.dataset.label) btn.dataset.label = btn.textContent;

      clearMsg('msgRegister');

      if (!name || !email || !pass || !confirm) {
        showMsg('msgRegister', 'Preencha todos os campos.', 'error'); return;
      }
      if (!isValidEmail(email)) {
        showMsg('msgRegister', 'E-mail inválido.', 'error'); return;
      }
      if (pass.length < 6) {
        showMsg('msgRegister', 'A senha deve ter no mínimo 6 caracteres.', 'error'); return;
      }
      if (pass !== confirm) {
        showMsg('msgRegister', 'As senhas não coincidem.', 'error'); return;
      }

      setLoading(btn, true);
      setTimeout(() => {
        setLoading(btn, false);
        const stored = JSON.parse(localStorage.getItem('ce_users') || '[]');
        if (stored.find(u => u.email === email)) {
          showMsg('msgRegister', 'Este e-mail já está cadastrado.', 'error'); return;
        }
        stored.push({ name, email, pass });
        localStorage.setItem('ce_users', JSON.stringify(stored));
        showMsg('msgRegister', `✓ Conta criada com sucesso! Bem-vindo(a), ${name}!`, 'success');
        document.getElementById('regName').value = '';
        document.getElementById('regEmail').value = '';
        document.getElementById('regPassword').value = '';
        document.getElementById('regConfirm').value = '';
      }, 1000);
    }

    function isValidEmail(e) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
    }
  </script>
